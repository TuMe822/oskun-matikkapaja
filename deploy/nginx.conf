# Oskun Matikkapaja 1.0 – Nginx-snippetti 3lm.fi:n HTTPS-palvelinlohkoon.
#
# Asennus TinyMonkeylle:
#   sudo cp deploy/nginx.conf /etc/nginx/snippets/oskun-matikkapaja.conf
# ja palvelinlohkoon (listen 443) rivi:
#   include snippets/oskun-matikkapaja.conf;
# Sitten: sudo nginx -t && sudo systemctl reload nginx
#
# Tiedostot: /var/www/oskun-matikkapaja/public/matikkapaja -> ../releases/<julkaisu>
# (scripts/deploy.sh vaihtaa symlinkin). Vanha 0.3.3 on omassa snippetissään
# osoitteessa /matikkapaja-old/.

location = /matikkapaja {
    return 301 /matikkapaja/;
}

# Vanhan 0.3.3-version service workerin poisto laitteilta ("kill switch").
# Poistetaan, kun 1.0 saa oman service workerin (PWA-kortti).
location = /matikkapaja/sw.js {
    alias /var/www/matikkapaja/killswitch/sw.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/matikkapaja/" always;
}

# Viten tiedostonimissä on sisällön tiiviste, joten ne voi välimuistittaa pysyvästi
location ^~ /matikkapaja/assets/ {
    root /var/www/oskun-matikkapaja/public;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Muut: index.html aina tuoreena, tuntemattomat polut sovellukselle (SPA)
location /matikkapaja/ {
    root /var/www/oskun-matikkapaja/public;
    index index.html;
    try_files $uri $uri/ /matikkapaja/index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}
